name: Investigación semanal

on:
  schedule:
    - cron: "0 23 * * 6"  # sábado 23:00 UTC (18:00 Lima), antes de que Claude escriba la semana a las 19:52
  workflow_dispatch: {}
  push:
    paths: ["canales/*/ruta.json", "scripts/pubmed.py"]

permissions:
  contents: write

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-api-python-client google-auth-oauthlib
      - name: Investigar
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN_MAYORDOM: ${{ secrets.REFRESH_TOKEN_MAYORDOM }}
          REFRESH_TOKEN_ES_SABATICA: ${{ secrets.REFRESH_TOKEN_ES_SABATICA }}
          REFRESH_TOKEN_PT_SABATINA: ${{ secrets.REFRESH_TOKEN_PT_SABATINA }}
          REFRESH_TOKEN_TOP10: ${{ secrets.REFRESH_TOKEN_TOP10 }}
          REFRESH_TOKEN_CRYPTULINE: ${{ secrets.REFRESH_TOKEN_CRYPTULINE }}
        run: python scripts/investigacion.py
      - name: Investigación científica (PubMed)
        run: pip install -q requests && python scripts/pubmed.py
      - name: Guardar
        run: |
          git config user.name "canales-bot"
          git config user.email "canales-bot@users.noreply.github.com"
          git add investigacion
          git diff --cached --quiet || git commit -m "Investigación semanal"
          git pull --rebase -q && git push -q || true
