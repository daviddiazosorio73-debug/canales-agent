name: tmp descarga
on:
  workflow_dispatch:
    inputs:
      url: {required: true}
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir w && cd w && git init -q && curl -sL "${{ inputs.url }}" | gzip -9 > datos.csv.gz
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git checkout -q -b tmp-datos && git add . && git commit -qm datos
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp-datos
