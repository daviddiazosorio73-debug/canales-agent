name: Top 10 - prueba de datos (no publica)
on:
  push:
    paths: [".github/workflows/top10-prueba.yml"]
  workflow_dispatch: {}
permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      REFRESH_TOKEN_TOP10: ${{ secrets.REFRESH_TOKEN_TOP10 }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests google-api-python-client google-auth-oauthlib babel num2words
      - run: |
          python -c "import json,sys;sys.path.insert(0,'scripts');from runner import token_file;token_file('top10-redes',json.load(open('canales.json'))['top10-redes'])"
          python scripts/top10_semana.py --prueba 2>&1 | tee prueba.txt
          for d in /tmp/top10_prueba/*; do python scripts/validate.py "$d" | tee -a prueba.txt; done
      - if: always()
        run: |
          mkdir -p investigacion && cp prueba.txt investigacion/top10_prueba.txt || true
          git config user.name "canales-bot"; git config user.email "canales-bot@users.noreply.github.com"
          git add investigacion/top10_prueba.txt; git commit -m "Top 10: resultado de la prueba de datos" || true
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 7; done
