name: tmp prueba sitio
on: {workflow_dispatch: {}}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://daviddiazosorio73-debug.github.io/catalogo/?d=wa"
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch()
              for ua,vp in [("movil",{'width':390,'height':844}),("pc",{'width':1366,'height':800})]:
                  pg=b.new_page(viewport=vp); e=[]
                  pg.on('pageerror',lambda x:e.append('JS:'+str(x)))
                  pg.on('console',lambda m: e.append('C:'+m.text) if m.type=='error' else None)
                  pg.on('requestfailed',lambda r: e.append('FALLO:'+r.url[:100]))
                  pg.goto('https://daviddiazosorio73-debug.github.io/catalogo/?d=wa',timeout=60000); pg.wait_for_timeout(9000)
                  print(ua,'TITULO:',pg.title()); print(ua,'TEXTO:',pg.inner_text('body')[:400].replace('\n',' | '))
                  print(ua,'IMGS ok/total:',pg.evaluate("[...document.images].filter(i=>i.complete&&i.naturalWidth>0).length+'/'+document.images.length"))
                  print(ua,'ERRORES:',e[:10])
              b.close()
          PY
