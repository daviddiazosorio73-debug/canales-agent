name: Top 10 - rehacer ediciones con el formato nuevo
# Orden del Fundador (27-nov-2026): rehacer la semana ya subida con el look de noticiero, la voz noticiero,
# los saludos y el GEO; mismas horas de estreno. Las viejas se borran de YouTube solo cuando la nueva ya subió.
on:
  push:
    paths: [".github/top10_rehacer.json"]
  workflow_dispatch: {}
concurrency:
  group: top10-rehacer
  cancel-in-progress: false
permissions:
  contents: write
env:
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  REFRESH_TOKEN_TOP10: ${{ secrets.REFRESH_TOKEN_TOP10 }}
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow requests google-api-python-client google-auth-oauthlib babel num2words
      - name: Carpetas nuevas (mismo libreto y datos) + saludos
        run: |
          python -c "import json,sys;sys.path.insert(0,'scripts');from runner import token_file;token_file('top10-redes',json.load(open('canales.json'))['top10-redes'])"
          python scripts/top10_rehacer.py "$(python -c "import json;print(json.load(open('.github/top10_rehacer.json'))['semana'])")"
          for d in $(python -c "import json;print(' '.join(json.load(open('top10_matriz.json'))))"); do python scripts/validate.py "$d"; done
      - id: m
        run: echo "matriz=$(cat top10_matriz.json)" >> "$GITHUB_OUTPUT"
      - name: Guardar
        run: |
          git config user.name "canales-bot"
          git config user.email "canales-bot@users.noreply.github.com"
          git add canales
          git commit -m "Top 10: ediciones rehechas (formato nuevo)" || true
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep 7; done

  producir:
    needs: prep
    if: needs.prep.outputs.matriz != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        proyecto: ${{ fromJson(needs.prep.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q pillow requests google-api-python-client google-auth-oauthlib edge-tts deep-translator sherpa-onnx==1.13.8 soundfile babel num2words
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts
      - name: Voz del Fundador
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          mkdir -p voces
          openssl enc -d -aes-256-cbc -pbkdf2 -in voces_ref/david.wav.enc -out voces/david.wav -pass env:VOICE_KEY
      - name: Producir y programar
        env:
          GH_TOKEN: ${{ github.token }}
          SOLO_PROYECTO: ${{ matrix.proyecto }}
          VENTANA_HORAS: "120"
        run: |
          set -o pipefail
          python scripts/runner.py 2>&1 | tee "$SOLO_PROYECTO/produccion.log"
      - name: Guardar
        if: always()
        run: |
          git config user.name "canales-bot"
          git config user.email "canales-bot@users.noreply.github.com"
          git add "${{ matrix.proyecto }}"
          git commit -m "Top 10 publicado: ${{ matrix.proyecto }}" || true
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase --autostash -q && git push -q && break; sleep $((RANDOM % 20 + 5)); done

  final:
    needs: producir
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install -q requests google-api-python-client google-auth-oauthlib
      - name: Borrar las viejas, actualizar Shorts y rehacer la vuelta al mundo
        run: |
          python -c "import json,sys;sys.path.insert(0,'scripts');from runner import token_file;token_file('top10-redes',json.load(open('canales.json'))['top10-redes'])"
          python scripts/top10_reemplazar.py "$(python -c "import json;print(json.load(open('.github/top10_rehacer.json'))['semana'])")"
          python scripts/top10_cadena.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "canales-bot"
          git config user.email "canales-bot@users.noreply.github.com"
          git add canales
          git commit -m "Top 10: reemplazo de la semana y vuelta al mundo" || true
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep 7; done
