name: Top 10 - reintentar producción
on:
  push:
    paths: [".github/top10_reproducir.json"]
  workflow_dispatch: {}
concurrency:
  group: top10-semanal
  cancel-in-progress: false
permissions:
  contents: write
env:
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  REFRESH_TOKEN_TOP10: ${{ secrets.REFRESH_TOKEN_TOP10 }}
jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matriz=$(python -c "import json;print(json.dumps([p for p in json.load(open('.github/top10_reproducir.json'))['proyectos']]))")" >> "$GITHUB_OUTPUT"
  producir:
    needs: lista
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        proyecto: ${{ fromJson(needs.lista.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q pillow requests google-api-python-client google-auth-oauthlib edge-tts sherpa-onnx==1.13.8 soundfile babel num2words
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts
      - name: Voz del Fundador
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          mkdir -p voces
          openssl enc -d -aes-256-cbc -pbkdf2 -in voces_ref/david.wav.enc -out voces/david.wav -pass env:VOICE_KEY
      - name: Esperar el libreto de Claude (si no llega a tiempo, sale el de plantilla)
        env:
          P: ${{ matrix.proyecto }}
        run: |
          for i in $(seq 1 110); do
            git pull -q --rebase origin main || true
            python - <<'PY' && break
          import json, os, sys
          from datetime import datetime, timezone
          g = json.load(open(os.environ["P"] + "/guion.json"))
          lim = datetime.fromisoformat(g.get("esperar_libreto_hasta", "2000-01-01T00:00:00Z").replace("Z", "+00:00"))
          sys.exit(0 if g.get("libreto") == "claude" or datetime.now(timezone.utc) >= lim else 1)
          PY
            sleep 60
          done
          python -c "import json,os;print('Libreto:', json.load(open(os.environ['P']+'/guion.json')).get('libreto'))"
      - name: Producir y programar
        env:
          SOLO_PROYECTO: ${{ matrix.proyecto }}
          VENTANA_HORAS: "120"
        run: |
          set -o pipefail
          python scripts/runner.py 2>&1 | tee "$SOLO_PROYECTO/produccion.log"
      - name: Guardar
        if: always()
        run: |
          git config user.name "canales-bot"
          git config user.email "canales-bot@users.noreply.github.com"
          git add "${{ matrix.proyecto }}"
          git commit -m "Top 10 publicado: ${{ matrix.proyecto }}" || true
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase --autostash -q && git push -q && break; sleep $((RANDOM % 20 + 5)); done

  cadena:
    needs: producir
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install -q requests google-api-python-client google-auth-oauthlib
      - name: Lista "Vuelta al mundo" y enlaces entre ediciones
        run: |
          python -c "import json,sys;sys.path.insert(0,'scripts');from runner import token_file;token_file('top10-redes',json.load(open('canales.json'))['top10-redes'])"
          python scripts/top10_cadena.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "canales-bot"
          git config user.email "canales-bot@users.noreply.github.com"
          git add canales
          git commit -m "Top 10: vuelta al mundo enlazada" || true
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep 7; done
