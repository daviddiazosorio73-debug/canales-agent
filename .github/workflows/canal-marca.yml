name: Marca del canal (SEO)
on:
  push:
    paths: ["canales/*/marca.json"]
  workflow_dispatch: {}
permissions:
  contents: write
env:
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  REFRESH_TOKEN_TOP10: ${{ secrets.REFRESH_TOKEN_TOP10 }}
  REFRESH_TOKEN_MAYORDOM: ${{ secrets.REFRESH_TOKEN_MAYORDOM }}
  REFRESH_TOKEN_ES_SABATICA: ${{ secrets.REFRESH_TOKEN_ES_SABATICA }}
  REFRESH_TOKEN_PT_SABATINA: ${{ secrets.REFRESH_TOKEN_PT_SABATINA }}
  REFRESH_TOKEN_CRYPTULINE: ${{ secrets.REFRESH_TOKEN_CRYPTULINE }}
jobs:
  marca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests google-api-python-client google-auth-oauthlib
      - name: Aplicar
        run: |
          for f in canales/*/marca.json; do
            c=$(basename $(dirname $f))
            python -c "import json,sys;sys.path.insert(0,'scripts');from runner import token_file;token_file('$c',json.load(open('canales.json'))['$c'])"
            python scripts/canal_marca.py $c 2>&1 | tail -5 | tee canales/$c/marca.log
          done
      - name: Guardar
        if: always()
        run: |
          git config user.name "canales-bot"
          git config user.email "canales-bot@users.noreply.github.com"
          git add canales/*/marca_actual.json canales/*/marca.log || true
          git commit -m "Marca del canal aplicada" || true
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep 7; done
