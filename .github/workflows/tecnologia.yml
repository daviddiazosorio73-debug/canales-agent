name: Tecno Log IA - Shorts (7 diarios dom-vie)

on:
  schedule:
    - cron: "41 * * * *"   # cada hora
  workflow_dispatch: {}

concurrency:
  group: tecnologia
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: pip install -q requests google-api-python-client google-auth-oauthlib playwright qrcode pillow numpy

      - name: ¿Hay Shorts por armar?
        id: rn
        run: echo "render=$(python scripts/tecnologia.py --necesita-render 2>/dev/null || echo si)" >> "$GITHUB_OUTPUT"

      - name: Navegador para armar los Shorts
        if: steps.rn.outputs.render != 'no'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m playwright install --with-deps chromium

      - name: Publicar (YouTube, Facebook, Instagram)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN_TECNOLOGIA: ${{ secrets.REFRESH_TOKEN_TECNOLOGIA }}
          META_PAGE_TOKEN_TECNOLOGIA: ${{ secrets.META_PAGE_TOKEN_TECNOLOGIA }}
          META_PAGINA_TECNOLOGIA: "TecnoLog"
        run: python scripts/tecnologia.py

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "canales-bot"
          git config user.email "canales-bot@users.noreply.github.com"
          git add canales/tecnologia/cola.json
          git diff --cached --quiet || git commit -m "Tecno Log IA: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done || true
