name: Producir y publicar

on:
  schedule:
    - cron: "17 * * * *"   # cada hora
  workflow_dispatch: {}

concurrency:
  group: producir
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q pillow requests google-api-python-client google-auth-oauthlib edge-tts sherpa-onnx==1.13.8 soundfile babel num2words

      - name: Voces offline (caché)
        uses: actions/cache@v4
        with:
          path: voces
          key: voces-v1

      - name: Descargar voz si falta
        run: |
          mkdir -p voces && cd voces
          [ -d vits-piper-es_MX-claude-high ] || { curl -sL -O https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-es_MX-claude-high.tar.bz2 && tar xjf vits-piper-es_MX-claude-high.tar.bz2 && rm *.tar.bz2; }

      - name: Voz del Fundador (solo si algún video pendiente la pide)
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          necesita=0
          for g in canales/*/proyectos/*/guion.json; do
            d=$(dirname "$g"); [ -f "$d/publicado.json" ] && continue
            grep -q '"voz_fundador": true' "$g" && { necesita=1; break; }
          done
          if [ "$necesita" = 1 ] && [ -n "$VOICE_KEY" ]; then
            pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
            pip install -q chatterbox-tts
            openssl enc -d -aes-256-cbc -pbkdf2 -in voces_ref/david.wav.enc -out voces/david.wav -pass env:VOICE_KEY
            echo "Voz del Fundador lista"
          else
            echo "No se necesita la voz del Fundador en esta corrida"
          fi

      - name: Producir y subir
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN_MAYORDOM: ${{ secrets.REFRESH_TOKEN_MAYORDOM }}
          REFRESH_TOKEN_ES_SABATICA: ${{ secrets.REFRESH_TOKEN_ES_SABATICA }}
          REFRESH_TOKEN_PT_SABATINA: ${{ secrets.REFRESH_TOKEN_PT_SABATINA }}
          REFRESH_TOKEN_TOP10: ${{ secrets.REFRESH_TOKEN_TOP10 }}
          REFRESH_TOKEN_CRYPTULINE: ${{ secrets.REFRESH_TOKEN_CRYPTULINE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          META_PAGE_TOKEN_MAYORDOM: ${{ secrets.META_PAGE_TOKEN_MAYORDOM }}
          META_PAGE_TOKEN_TOP10: ${{ secrets.META_PAGE_TOKEN_TOP10 }}
          META_PAGE_TOKEN_ES_SABATICA: ${{ secrets.META_PAGE_TOKEN_ES_SABATICA }}
          META_PAGE_TOKEN_PT_SABATINA: ${{ secrets.META_PAGE_TOKEN_PT_SABATINA }}
          META_PAGE_TOKEN_CRYPTULINE: ${{ secrets.META_PAGE_TOKEN_CRYPTULINE }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/runner.py

      - name: Listas de reproducción
        if: always()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN_MAYORDOM: ${{ secrets.REFRESH_TOKEN_MAYORDOM }}
          REFRESH_TOKEN_ES_SABATICA: ${{ secrets.REFRESH_TOKEN_ES_SABATICA }}
          REFRESH_TOKEN_PT_SABATINA: ${{ secrets.REFRESH_TOKEN_PT_SABATINA }}
          REFRESH_TOKEN_TOP10: ${{ secrets.REFRESH_TOKEN_TOP10 }}
          REFRESH_TOKEN_CRYPTULINE: ${{ secrets.REFRESH_TOKEN_CRYPTULINE }}
        run: python scripts/listas.py

      - name: Top 10 - enlaces de la vuelta al mundo
        if: always()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN_TOP10: ${{ secrets.REFRESH_TOKEN_TOP10 }}
          REFRESH_TOKEN_CRYPTULINE: ${{ secrets.REFRESH_TOKEN_CRYPTULINE }}
        run: |
          python -c "import json,sys;sys.path.insert(0,'scripts');from runner import token_file;token_file('top10-redes',json.load(open('canales.json'))['top10-redes'])" || true
          python scripts/top10_cadena.py || echo "cadena: aviso"

      - name: Instagram y Facebook
        if: always()
        env:
          META_PAGE_TOKEN_MAYORDOM: ${{ secrets.META_PAGE_TOKEN_MAYORDOM }}
          META_PAGE_TOKEN_TOP10: ${{ secrets.META_PAGE_TOKEN_TOP10 }}
          META_PAGE_TOKEN_ES_SABATICA: ${{ secrets.META_PAGE_TOKEN_ES_SABATICA }}
          META_PAGE_TOKEN_PT_SABATINA: ${{ secrets.META_PAGE_TOKEN_PT_SABATINA }}
          META_PAGE_TOKEN_CRYPTULINE: ${{ secrets.META_PAGE_TOKEN_CRYPTULINE }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/meta.py publicar

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "canales-bot"
          git config user.email "canales-bot@users.noreply.github.com"
          git add -A canales reporte.md
          git diff --cached --quiet || git commit -m "Publicado: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash -q && git push -q || true
