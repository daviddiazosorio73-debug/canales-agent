name: Vigía de la semana

on:
  schedule:
    - cron: "30 4 * * 0"  # domingo 04:30 UTC = sábado 23:30 Lima, después de la tarea semanal (19:52) y su reintento (20:22)
    - cron: "0 0 * * 0"  # domingo 00:00 UTC = sábado 19:00 Lima: ¿hay temas del día verificados antes de la tarea de las 19:52?
  workflow_dispatch:
    inputs:
      inicio:
        description: "Domingo de inicio (AAAA-MM-DD); vacío = el próximo"
        required: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Temas del día de Escuela Sabática (sábado 19:00 Lima)
        if: github.event.schedule == '0 0 * * 0'
        run: python scripts/vigia_semana.py --indice
      - name: Revisar guiones de la semana
        if: github.event.schedule != '0 0 * * 0'
        run: python scripts/vigia_semana.py ${{ github.event.inputs.inicio }}
